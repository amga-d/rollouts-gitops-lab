apiVersion: v1
kind: Service
metadata:
  name: podinfo-active
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: podinfo-active
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-preview
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: podinfo-preview
  type: ClusterIP
