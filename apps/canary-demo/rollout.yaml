apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  replicas: 10
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
            - name: http-metrics
              containerPort: 9797
          env:
            # --- release-controlled values (edited by scripts/release.sh) ---
            - name: PODINFO_UI_MESSAGE
              value: "release-8-buggy"
            - name: PODINFO_RANDOM_ERROR
              value: "true"
            - name: PODINFO_RANDOM_DELAY
              value: "false"
            # --- static config ---
            - name: PODINFO_PORT_METRICS        # metrics + /healthz on a separate port,
              value: "9797"                     # unaffected by injected errors
            - name: PODINFO_RANDOM_DELAY_UNIT
              value: "ms"
            - name: PODINFO_RANDOM_DELAY_MIN
              value: "800"
            - name: PODINFO_RANDOM_DELAY_MAX
              value: "1500"
          readinessProbe:
            httpGet: { path: /healthz, port: http-metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http-metrics }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 128Mi }
  strategy:
    canary:
      # background analysis
      analysis:
        templates:
          - templateName: success-rate-continuous
            clusterScope: true
        startingStep: 1
        args:
          - name: namespace
            value: canary-demo
          - name: pod-template-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 20
        - pause: { duration: 60s }
        # ---- inline analysis: the rollout blocks here until the run finishes ----
        - analysis:
            templates:
              - templateName: latency-p95
                clusterScope: true
            args:
              - name: namespace
                value: canary-demo
              - name: pod-template-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 40
        - pause: { duration: 60s }
        - setWeight: 60
        - pause: { duration: 60s }
        - setWeight: 80
        - pause: { duration: 60s }

